<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SIS Volleyball — Tiger Spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--or:#ff8a1e;--gold:#ffd23d;--bg:#0b0816;--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#05030c;overflow:hidden;font-family:Barlow,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;display:block}
#stage{position:fixed;overflow:hidden;pointer-events:none;font-size:calc(var(--u)*16)}
#stage>.scr{position:absolute;inset:0;display:none;pointer-events:auto;font-family:"Barlow Condensed",sans-serif}
#stage>.scr.show{display:flex}
.h1{font:800 calc(var(--u)*64)/1 "Barlow Condensed";letter-spacing:.02em;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn{font:800 calc(var(--u)*30)/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:#1a1020;background:linear-gradient(#ffd23d,#ff9a1e);border:0;border-radius:calc(var(--u)*14);padding:calc(var(--u)*16) calc(var(--u)*34);cursor:pointer;box-shadow:0 calc(var(--u)*6) 0 #b55a0a,0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.45);transition:transform .08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b55a0a}
.btn.big{font-size:calc(var(--u)*46);padding:calc(var(--u)*20) calc(var(--u)*60)}
.btn.ghost{background:rgba(20,14,40,.85);color:#fff;box-shadow:0 calc(var(--u)*5) 0 #05030c,inset 0 0 0 2px rgba(255,255,255,.25)}
.btn.sm{font-size:calc(var(--u)*22);padding:calc(var(--u)*10) calc(var(--u)*22)}
#title{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14);background:radial-gradient(ellipse at 50% 40%,rgba(10,6,24,.2),rgba(5,3,12,.8))}
#title .logo{mix-blend-mode:screen;width:calc(var(--u)*170);filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
#title .sub{font:700 calc(var(--u)*22)/1 "Barlow Condensed";letter-spacing:.35em;color:#ffcf6a;text-transform:uppercase}
#title .row{display:flex;gap:calc(var(--u)*16);margin-top:calc(var(--u)*6)}
#title .stat{font:700 calc(var(--u)*20) "Barlow Condensed";color:#cdd;opacity:.9;letter-spacing:.08em}
.coin{color:#ffd23d}.coin:before{content:"●";margin-right:.3em;font-size:.8em}
#title .tip{position:absolute;bottom:calc(var(--u)*16);font:600 calc(var(--u)*18) Barlow;color:#aab;text-align:center;width:100%}
#role,#roll{flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--u)*24) calc(var(--u)*40);background:radial-gradient(ellipse at 50% 30%,rgba(16,10,36,.82),rgba(5,3,12,.95));gap:calc(var(--u)*14)}
.cap{font:700 calc(var(--u)*20) "Barlow Condensed";letter-spacing:.3em;color:#ffcf6a;text-transform:uppercase}
.rrow{display:flex;gap:calc(var(--u)*22);width:100%;justify-content:center}
.rcard{--c:#fff;width:calc(var(--u)*330);padding:calc(var(--u)*26) calc(var(--u)*24);border-radius:calc(var(--u)*20);background:linear-gradient(160deg,rgba(40,30,70,.95),rgba(14,9,28,.95));border:calc(var(--u)*3) solid color-mix(in srgb,var(--c) 55%,transparent);cursor:pointer;transition:transform .14s,box-shadow .14s;position:relative;overflow:hidden}
.rcard:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,color-mix(in srgb,var(--c) 22%,transparent) 50%,transparent 60%);transform:translateX(-100%);transition:transform .5s}
.rcard:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 0 calc(var(--u)*40) color-mix(in srgb,var(--c) 60%,transparent)}.rcard:hover:before{transform:translateX(100%)}
.rcard.sel{border-color:var(--c)}
.rcard .ri{font-size:calc(var(--u)*54)}
.rcard .rn{font:800 calc(var(--u)*46)/1 "Barlow Condensed";text-transform:uppercase;color:var(--c);margin:calc(var(--u)*6) 0}
.rcard .rd{font:600 calc(var(--u)*19)/1.25 Barlow;color:#dde}
.rcard ul{margin:calc(var(--u)*14) 0 0;padding-left:1.1em;font:500 calc(var(--u)*16)/1.45 Barlow;color:#aab}
.slots{display:flex;gap:calc(var(--u)*24);justify-content:center}
.slot{--rc:#fff;--gl:#fff;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8)}
.slot .rl{font:800 calc(var(--u)*22) "Barlow Condensed";letter-spacing:.14em;color:var(--rc);text-transform:uppercase}
.slot.you .rl{background:var(--rc);color:#120a20;padding:1px 12px;border-radius:8px}
.card3{width:calc(var(--u)*290);height:calc(var(--u)*400);border-radius:calc(var(--u)*18);background:#120c22;overflow:hidden;position:relative;border:calc(var(--u)*3) solid rgba(255,255,255,.15)}
.slot.done .card3{border-color:var(--gl);animation:land .5s cubic-bezier(.2,1.6,.4,1)}
.slot.hi .card3{box-shadow:0 0 calc(var(--u)*50) var(--gl),inset 0 0 calc(var(--u)*30) color-mix(in srgb,var(--gl) 40%,transparent)}
.slot.you .card3{outline:calc(var(--u)*3) solid var(--rc);outline-offset:calc(var(--u)*5)}
@keyframes land{from{transform:scale(.8) rotateY(70deg)}}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.face img{width:100%;height:56%;object-fit:cover;object-position:50% 20%;-webkit-mask:linear-gradient(#000 70%,transparent)}
img.zap{animation:zap 1.1s infinite}
@keyframes zap{0%,100%{filter:saturate(1.5) contrast(1.15)}7%{filter:saturate(1.8) contrast(1.3) brightness(1.7) hue-rotate(160deg)}11%{filter:saturate(1.5) contrast(1.15) brightness(1.15)}14%{filter:saturate(1.9) brightness(1.5) hue-rotate(-60deg)}20%{filter:saturate(1.5) contrast(1.15)}}
.face.spin img{height:100%;filter:blur(2px) brightness(.7);-webkit-mask:none}
.face .rar{font:800 calc(var(--u)*15) "Barlow Condensed";letter-spacing:.3em;color:var(--c);text-transform:uppercase;margin-top:calc(var(--u)*-8)}
.face .nm{font:800 calc(var(--u)*34)/1 "Barlow Condensed";text-transform:uppercase}
.face .tt{font:600 calc(var(--u)*15) Barlow;color:#aab;margin-bottom:calc(var(--u)*8)}
.face .ln{width:86%;display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.face .ln div{display:flex;justify-content:space-between;font:700 calc(var(--u)*17) "Barlow Condensed";letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:2px}
.face .ln span{color:#99a}.face .ln b{color:#fff;text-align:right}
.card3{width:calc(var(--u)*380);height:calc(var(--u)*270)}
.face.h{flex-direction:row;align-items:stretch}
.face.h img{width:38%;height:100%!important;-webkit-mask:linear-gradient(90deg,#000 70%,transparent)}
.face.h .info{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*3);padding:calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*8) 0;overflow-y:auto;text-align:left}
.face.h .rar{margin:0;letter-spacing:.2em;font-size:calc(var(--u)*12)}
.face.h .nm{font-size:calc(var(--u)*26)}
.face.h .tt{font-size:calc(var(--u)*12);margin:0}
.face .tt b{color:#fff}
.face.empty{justify-content:center;font:700 calc(var(--u)*20) "Barlow Condensed";color:#889;letter-spacing:.08em}
.ab{display:flex;flex-direction:column;gap:calc(var(--u)*4);text-align:left}
.ab>div{background:rgba(255,255,255,.05);border-radius:calc(var(--u)*7);padding:calc(var(--u)*3) calc(var(--u)*7)}
.ab .act{background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.ab span{font:800 calc(var(--u)*10) "Barlow Condensed";letter-spacing:.16em;color:#99a;display:block}
.ab b{font:800 calc(var(--u)*15)/1.1 "Barlow Condensed";color:#fff;letter-spacing:.04em}
.ab p{font:500 calc(var(--u)*11)/1.25 Barlow;color:#c9cbe0;margin:1px 0 0}
#roll{gap:calc(var(--u)*8)!important}
.slot .sub{font:800 calc(var(--u)*13) "Barlow Condensed";letter-spacing:.16em;color:#aab;display:flex;gap:calc(var(--u)*8);align-items:center}
.btn.xs{font-size:calc(var(--u)*13);padding:calc(var(--u)*2) calc(var(--u)*10)}
.offers,.inv{display:flex;gap:calc(var(--u)*6);max-width:calc(var(--u)*380);overflow-x:auto;padding-bottom:2px}
.offers.pop .mini{animation:land .45s cubic-bezier(.2,1.6,.4,1) both}.offers.pop .mini:nth-child(2){animation-delay:.08s}.offers.pop .mini:nth-child(3){animation-delay:.16s}
.mini{--c:#fff;flex:0 0 calc(var(--u)*92);background:#120c22;border:calc(var(--u)*2) solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:calc(var(--u)*10);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.mini:hover{transform:translateY(-3px)}.mini.on{border-color:#ffd23d;box-shadow:0 0 calc(var(--u)*14) #ffd23d88}
.mini img{width:100%;height:calc(var(--u)*44);object-fit:cover;object-position:50% 20%}
.mini b{font:800 calc(var(--u)*14)/1.1 "Barlow Condensed";text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.mini i{font:800 calc(var(--u)*10) "Barlow Condensed";font-style:normal;letter-spacing:.14em;color:var(--c);text-transform:uppercase;margin-bottom:2px}
.inv .mini{flex:0 0 auto;flex-direction:row;padding:0 calc(var(--u)*8) 0 0;gap:calc(var(--u)*4);height:calc(var(--u)*30)}.inv .mini img{width:calc(var(--u)*28);height:100%}.inv .mini i{display:none}
.inv .none{font:600 calc(var(--u)*13) Barlow;color:#667}
#roll{justify-content:flex-start!important;overflow-y:auto}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default;transform:none}
#rMsg{font:600 calc(var(--u)*18) Barlow;color:#ff8a8a;min-height:1.2em}
#result{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*10);background:radial-gradient(circle,rgba(10,6,24,.82),rgba(5,3,12,.95))}
#result .stats{display:grid;grid-template-columns:repeat(5,auto);gap:calc(var(--u)*8) calc(var(--u)*30);font:700 calc(var(--u)*22) "Barlow Condensed";color:#cdd;text-align:center;margin:calc(var(--u)*8) 0}
#result .stats b{display:block;font-size:calc(var(--u)*40);color:#fff}
#result .rw{font:800 calc(var(--u)*34) "Barlow Condensed"}
#pause{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*16);background:rgba(5,3,12,.78)}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
body.touch.playing #touch{display:block}
#touch .t{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font:800 calc(var(--u)*34) "Barlow Condensed";color:#fff}
#touch .t:active,#touch .t.on{background:rgba(255,200,60,.5)}
#top-ui{position:absolute;right:calc(var(--u)*14);top:calc(var(--u)*10);display:none;gap:8px;pointer-events:auto}
body.playing #top-ui{display:flex}
.ib{width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(10,6,24,.7);color:#fff;font:800 calc(var(--u)*20) Barlow;cursor:pointer}
#help{position:absolute;left:0;right:0;bottom:calc(var(--u)*8);text-align:center;font:600 calc(var(--u)*16) Barlow;color:rgba(255,255,255,.55);display:none}
body.playing:not(.touch) #help{display:block}
#mp{flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--u)*10);padding-top:calc(var(--u)*24);overflow-y:auto;background:radial-gradient(circle,rgba(10,6,24,.84),rgba(5,3,12,.96))}
#mpBody{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12);width:min(94%,calc(var(--u)*760))}
.mprow{display:flex;flex-wrap:wrap;gap:calc(var(--u)*10);align-items:center;justify-content:center}
.mpnote{font:600 calc(var(--u)*20)/1.35 Barlow;color:#c9cbe0;text-align:center;max-width:calc(var(--u)*620)}.mpnote.sm{font-size:calc(var(--u)*15);color:#99a}
#mpMsg{font:600 calc(var(--u)*16) Barlow;color:#ff8a8a;min-height:1.2em}
#mp input{font:700 calc(var(--u)*20) "Barlow Condensed";letter-spacing:.06em;background:#120c22;color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7) calc(var(--u)*12);user-select:text;-webkit-user-select:text;outline:0}
#mp input:focus{border-color:#ffd23d}#mpCode{width:calc(var(--u)*90);text-transform:uppercase;text-align:center}
.mpnm{font:800 calc(var(--u)*14) "Barlow Condensed";letter-spacing:.14em;color:#aab;text-transform:uppercase;display:flex;gap:calc(var(--u)*8);align-items:center}.mpnm input{width:calc(var(--u)*170)}
.mplist{display:flex;flex-direction:column;gap:calc(var(--u)*6);width:100%;max-width:calc(var(--u)*560)}
.mpp{display:flex;align-items:center;gap:calc(var(--u)*12);background:#120c22;border:2px solid rgba(255,255,255,.12);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7) calc(var(--u)*12)}
.mpp b{font:800 calc(var(--u)*22) "Barlow Condensed";letter-spacing:.12em;color:#ffd23d}.mpp span{flex:1;font:600 calc(var(--u)*15) Barlow;color:#c9cbe0}
.mpcode{font:800 calc(var(--u)*18) "Barlow Condensed";letter-spacing:.2em;color:#aab}.mpcode b{font-size:calc(var(--u)*34);color:#ffd23d;margin-left:calc(var(--u)*6)}
.mpres{font:800 calc(var(--u)*30) "Barlow Condensed";letter-spacing:.06em;color:#ffd23d}
.mpteams{display:flex;gap:calc(var(--u)*14);align-items:center}.mpt{display:flex;flex-direction:column;gap:calc(var(--u)*6);align-items:stretch;width:calc(var(--u)*250)}
.mpvs{font:800 calc(var(--u)*30) "Barlow Condensed";color:#ff4d8d}
.mps{display:flex;align-items:center;gap:calc(var(--u)*10);background:#120c22;border:2px solid color-mix(in srgb,var(--rc) 45%,transparent);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*12)}
.mps.ed{cursor:pointer}.mps.ed:hover{background:#1c1336}.mps.me{box-shadow:0 0 calc(var(--u)*12) #ffd23d88;border-color:#ffd23d}
.mps i{font:800 calc(var(--u)*13) "Barlow Condensed";font-style:normal;letter-spacing:.12em;color:var(--rc);width:calc(var(--u)*24)}.mps b{font:800 calc(var(--u)*19) "Barlow Condensed";color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border-radius:calc(var(--u)*10);overflow:hidden;border:2px solid rgba(255,255,255,.2)}
.seg button{font:800 calc(var(--u)*16) "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;background:#120c22;color:#ccd;border:0;padding:calc(var(--u)*7) calc(var(--u)*13);cursor:pointer}
.seg button.on{background:linear-gradient(#ffd23d,#ff9a1e);color:#1a1020}.seg button:disabled{cursor:default}.seg button:disabled:not(.on){opacity:.5}
</style></head><body>
<canvas id="cv"></canvas>
<div id="stage">
 <div id="title" class="scr show">
  <img class="logo" src="assets/logo.png" alt="">
  <div class="h1">Tiger Spike</div><div class="sub">SIS Volleyball</div>
  <div style="height:calc(var(--u)*10)"></div>
  <button class="btn big" id="bPlay">▶ PLAY</button>
  <div class="row"><button class="btn ghost" id="bMP">👥 Multiplayer</button><button class="btn ghost sm" id="bMute">Sound: On</button></div>
  <div class="stat" id="tStat"></div>
  <div class="tip">3v3 · pick a position, draft your squad · SPACE to jump, SPACE again to spike · ↑ ↓ aim / toss · ← → move</div>
 </div>
 <div id="role" class="scr">
  <div class="cap">Step 1</div><div class="h1">Choose your position</div>
  <div class="rrow" id="roles"></div>
  <button class="btn ghost sm" id="bRBack">← Back</button>
 </div>
 <div id="roll" class="scr">
  <div class="h1" style="font-size:calc(var(--u)*38)">Draft your squad</div>
  <div class="slots" id="slots"></div>
  <div id="rMsg"></div>
  <div style="display:flex;gap:calc(var(--u)*14);align-items:center"><button class="btn ghost sm" id="bLBack">← Position</button><button class="btn ghost" id="bReroll">↻ Reroll</button><button class="btn big" id="bGo">▶ Start match</button><span class="stat" id="rCoins" style="font:800 calc(var(--u)*26) 'Barlow Condensed'"></span></div>
 </div>
 <div id="mp" class="scr">
  <div class="h1" style="font-size:calc(var(--u)*44)">Multiplayer</div>
  <div id="mpBody"></div><div id="mpMsg"></div>
  <button class="btn ghost sm" id="bMPBack">← Menu</button>
 </div>
 <div id="result" class="scr">
  <div class="h1" id="rTitle" style="font-size:calc(var(--u)*96)"></div>
  <div class="rw" id="rScore"></div>
  <div class="stats" id="rStats"></div>
  <div class="rw coin" id="rCoin"></div>
  <div id="rNew" class="rw" style="color:#ff4d8d"></div>
  <div style="display:flex;gap:calc(var(--u)*14);margin-top:calc(var(--u)*10)"><button class="btn big" id="bNext">▶ Next match</button><button class="btn ghost" id="bTeam">Squad</button><button class="btn ghost" id="bMenu">Menu</button></div>
 </div>
 <div id="pause" class="scr"><div class="h1">Paused</div><button class="btn" id="bResume">Resume</button><button class="btn ghost" id="bQuit">Quit match</button></div>
 <div id="top-ui"><button class="ib" id="ibMute">♪</button><button class="ib" id="ibPause">II</button></div>
 <div id="help">SPACE act (jump, then SPACE again to hit) · ↑ ↓ aim / toss · ← → move · ESC pause</div>
 <div id="touch">
  <div class="t" id="tL" style="left:3%;bottom:6%;width:calc(var(--u)*110);height:calc(var(--u)*110)">◀</div>
  <div class="t" id="tR" style="left:15%;bottom:6%;width:calc(var(--u)*110);height:calc(var(--u)*110)">▶</div>
  <div class="t" id="tU" style="left:9%;bottom:30%;width:calc(var(--u)*70);height:calc(var(--u)*70)">▲</div>
  <div class="t" id="tD" style="left:9%;bottom:18%;width:calc(var(--u)*70);height:calc(var(--u)*70)">▼</div>
  <div class="t" id="tA" style="right:4%;bottom:7%;width:calc(var(--u)*170);height:calc(var(--u)*170);font-size:calc(var(--u)*44);background:rgba(255,138,30,.35)">HIT</div>
 </div>
</div>
<script src="js/core.js?v=14"></script><script src="js/fx.js?v=14"></script><script src="js/chars.js?v=14"></script><script src="js/game.js?v=14"></script><script src="js/ults.js?v=14"></script><script src="js/ui.js?v=14"></script><script src="js/trystero.js?v=14"></script><script src="js/net.js?v=14"></script>
</body></html>
